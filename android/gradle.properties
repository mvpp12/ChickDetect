# Sized for an 8 GB laptop with ~2 GB free: the build used to die with
# "insufficient memory for the Java Runtime" (see the hs_err_pid logs).
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=96m -XX:+UseSerialGC
org.gradle.workers.max=1
org.gradle.daemon=false
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Compile Kotlin inside the Gradle JVM instead of starting a second daemon
# JVM next to it; two large JVMs were what ran this machine out of memory.
kotlin.compiler.execution.strategy=in-process

# Incremental Kotlin caches were left corrupt by builds that ran out of
# memory ("Could not close incremental caches"). Full compiles are slower
# only on repeat builds, and use less memory.
kotlin.incremental=false
