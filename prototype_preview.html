<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChickDetect Prototype</title>
  <style>
    :root {
      --ink: #172017;
      --muted: #687168;
      --paper: #f5f7f1;
      --surface: #ffffff;
      --line: #dfe6d9;
      --green: #2d6b38;
      --green-dark: #174a28;
      --green-soft: #e2f0df;
      --lime: #b5d76c;
      --amber: #d9912b;
      --red: #bd4c3f;
      --shadow: 0 18px 50px rgba(25, 55, 32, .12);
      --radius: 22px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: #dfe8db;
      font-family: Georgia, "Times New Roman", serif;
    }
    button { font: inherit; cursor: pointer; }
    .page { min-height: 100vh; display: grid; place-items: center; padding: 32px; }
    .device {
      width: min(100%, 430px);
      min-height: min(860px, calc(100vh - 64px));
      max-height: 900px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--paper);
      border: 8px solid #18211a;
      border-radius: 34px;
      box-shadow: 0 30px 90px rgba(20, 38, 23, .28);
    }
    .screen { flex: 1; min-height: 0; overflow: auto; }
    .hidden { display: none !important; }
    .topbar { display:flex; align-items:center; justify-content:space-between; padding: 18px 20px 12px; }
    .brand { display:flex; align-items:center; gap: 10px; }
    .brand-mark { width: 38px; height: 38px; display:grid; place-items:center; border-radius: 12px; color:#fff; background:var(--green); font-family: Arial, sans-serif; font-weight:800; }
    .eyebrow { margin:0 0 3px; color:var(--green); font: 700 10px/1 Arial, sans-serif; letter-spacing:.14em; text-transform:uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: clamp(29px, 8vw, 42px); line-height: 1.02; letter-spacing: -.02em; margin-bottom: 14px; }
    h2 { font-size: 25px; line-height:1.08; margin-bottom: 10px; }
    h3 { font-size: 17px; margin-bottom: 7px; }
    p { color: var(--muted); line-height:1.5; }
    .onboarding { display:flex; flex-direction:column; min-height:100%; padding: 14px 20px 24px; }
    .onboard-head { display:flex; justify-content:space-between; align-items:center; margin-bottom: 14px; }
    .step { color:var(--green); font: 700 11px Arial, sans-serif; letter-spacing:.1em; text-transform:uppercase; }
    .text-button { border:0; color:var(--green); background:transparent; padding:10px 0; font-weight:700; }
    .hero-image { width:100%; aspect-ratio:16/9; display:block; object-fit:cover; border-radius:var(--radius); box-shadow: var(--shadow); }
    .onboard-copy { padding: 27px 3px 18px; }
    .onboard-copy p { font-size:16px; max-width:34em; }
    .dots { display:flex; gap:7px; margin: 5px 0 20px; }
    .dot { width:8px; height:8px; padding:0; border:0; border-radius:99px; background:#c4d4bf; }
    .dot.active { width:30px; background:var(--green); }
    .primary { width:100%; border:0; border-radius:14px; padding:15px 18px; color:#fff; background:var(--green); font:700 15px Arial, sans-serif; box-shadow:0 8px 18px rgba(45,107,56,.2); }
    .primary:hover { background:var(--green-dark); }
    .secondary { border:1px solid var(--line); border-radius:12px; padding:12px 15px; color:var(--green); background:#fff; font-weight:700; }
    .scanner { min-height:100%; display:flex; flex-direction:column; background:#e8eee3; }
    .scanner-top { display:flex; align-items:center; justify-content:space-between; padding:13px 16px; background:var(--surface); }
    .status { color:var(--green); font:700 10px Arial, sans-serif; letter-spacing:.08em; text-transform:uppercase; }
    .icon-button { width:38px; height:38px; border:1px solid var(--line); border-radius:12px; color:var(--green); background:#fff; font-size:18px; }
    .scan-copy { padding: 18px 18px 12px; }
    .scan-copy h2 { margin-bottom:4px; }
    .scan-copy p { margin-bottom:0; font-size:14px; }
    .camera { position:relative; margin:0 14px; min-height:300px; flex:1; overflow:hidden; border-radius:24px; background:#755f45; }
    .camera::before { content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(15,25,16,.22), transparent 45%, rgba(10,20,10,.35)); z-index:1; }
    .camera-art { width:100%; height:100%; background:radial-gradient(circle at 52% 50%, #bea875 0 8%, transparent 9%), radial-gradient(circle at 28% 28%, #91764d 0 12%, transparent 13%), radial-gradient(circle at 76% 72%, #554732 0 18%, transparent 19%), repeating-linear-gradient(24deg, #6f5a3d 0 18px, #846d48 19px 23px, #5c4a34 24px 38px); filter:saturate(.82) contrast(.95); }
    .frame { position:absolute; z-index:2; inset:17% 13%; border:2px solid rgba(190,255,147,.95); border-radius:22px; box-shadow:0 0 0 999px rgba(4,15,7,.16), 0 0 28px rgba(181,215,108,.55); }
    .frame::after { content:"70% FRAME"; position:absolute; right:12px; top:-29px; padding:7px 9px; border-radius:8px; color:#ddf5c6; background:rgba(15,42,19,.75); font:700 10px Arial,sans-serif; letter-spacing:.05em; }
    .camera-label { position:absolute; z-index:3; bottom:14px; left:14px; right:14px; display:flex; justify-content:space-between; align-items:center; color:#fff; font:700 12px Arial,sans-serif; }
    .pill { padding:7px 10px; border-radius:99px; background:rgba(14,38,18,.75); }
    .control-row { display:grid; grid-template-columns:1fr 1.1fr 1fr; gap:9px; padding:15px 16px 9px; }
    .control { border:0; padding:10px 4px; border-radius:14px; color:var(--green); background:var(--surface); font:700 11px Arial,sans-serif; box-shadow:0 4px 12px rgba(34,68,40,.08); }
    .control strong { display:block; margin-bottom:5px; font-size:22px; }
    .scan-button { background:var(--green); color:#fff; }
    .privacy { padding:0 16px 12px; text-align:center; color:var(--muted); font:11px Arial,sans-serif; }
    .nav { display:grid; grid-template-columns:repeat(4,1fr); padding:8px 7px 9px; background:#fff; border-top:1px solid var(--line); }
    .nav button { border:0; padding:8px 2px 4px; color:#8a9689; background:transparent; font:700 10px Arial,sans-serif; }
    .nav button.active { color:var(--green); }
    .nav span { display:block; margin-bottom:4px; font-size:18px; }
    .content { padding:18px 18px 24px; }
    .section-title { display:flex; align-items:end; justify-content:space-between; gap:12px; margin-bottom:16px; }
    .section-title h2 { margin:0; }
    .card { padding:16px; margin-bottom:12px; border:1px solid var(--line); border-radius:18px; background:#fff; box-shadow:0 8px 24px rgba(24,57,30,.05); }
    .metric { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:18px; }
    .metric .card { margin:0; padding:12px 9px; text-align:center; }
    .metric strong { display:block; color:var(--green); font:700 22px Arial,sans-serif; }
    .metric span { color:var(--muted); font:11px Arial,sans-serif; }
    .history-item { display:flex; align-items:center; gap:12px; }
    .history-thumb { width:62px; height:62px; display:grid; place-items:center; border-radius:14px; color:#fff; background:linear-gradient(145deg, #4d8d57, #1e5731); font:700 25px Arial,sans-serif; }
    .history-item h3 { margin:0 0 4px; font-size:15px; }
    .history-item p { margin:0; font:11px Arial,sans-serif; }
    .tag { margin-left:auto; padding:6px 8px; border-radius:99px; color:#28703a; background:#e3f5e2; font:700 10px Arial,sans-serif; }
    .guide-card { display:grid; grid-template-columns:72px 1fr; gap:13px; align-items:center; }
    .guide-card img { width:72px; height:72px; object-fit:cover; border-radius:14px; }
    .guide-card p { margin:0; font-size:13px; }
    .setting { display:flex; align-items:center; gap:12px; padding:15px 0; border-bottom:1px solid var(--line); }
    .setting:last-child { border:0; }
    .setting-icon { width:36px; height:36px; display:grid; place-items:center; border-radius:11px; color:var(--green); background:var(--green-soft); }
    .setting-copy { flex:1; }
    .setting-copy strong { display:block; margin-bottom:3px; font-size:14px; }
    .setting-copy span { color:var(--muted); font:12px Arial,sans-serif; }
    .toggle { width:42px; height:24px; padding:3px; border:0; border-radius:99px; background:#a8b6a6; }
    .toggle::after { content:""; display:block; width:18px; height:18px; border-radius:50%; background:#fff; transition:transform .2s; }
    .toggle.on { background:var(--green); }
    .toggle.on::after { transform:translateX(18px); }
    .result { padding:20px; }
    .result-art { width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:20px; margin-bottom:17px; }
    .success { padding:14px; border-radius:15px; color:#226c35; background:#e4f4df; font-weight:700; }
    .result-row { display:flex; justify-content:space-between; gap:16px; padding:13px 0; border-bottom:1px solid var(--line); font:13px Arial,sans-serif; }
    .result-row span { color:var(--muted); }
    .result-row strong { color:var(--ink); text-align:right; }
    .actions { display:grid; gap:9px; margin-top:18px; }
    @media (max-width: 520px) { .page { padding:0; } .device { width:100%; min-height:100vh; max-height:none; border:0; border-radius:0; } }
  </style>
</head>
<body>
  <main class="page">
    <section class="device" aria-label="ChickDetect prototype">
      <div id="app" class="screen"></div>
      <nav id="nav" class="nav hidden" aria-label="Main navigation">
        <button data-screen="scanner" class="active"><span>⌾</span>Scan</button>
        <button data-screen="history"><span>◷</span>History</button>
        <button data-screen="guide"><span>▣</span>Guide</button>
        <button data-screen="settings"><span>⚙</span>Settings</button>
      </nav>
    </section>
  </main>
  <script>
    const app = document.querySelector('#app');
    const nav = document.querySelector('#nav');
    let onboardingStep = 0;
    const onboarding = [
      { image:'assets/onboarding/step_scan.png', title:'Find fresh droppings', text:'Scan within 10 to 20 minutes after they appear. Dry droppings change colour and shape, which can confuse the model.' },
      { image:'assets/onboarding/step_analyze.png', title:'One dropping in the centre', text:'Separate one sample. Keep bedding, soil, feet and other droppings out of the frame.' },
      { image:'assets/onboarding/step_result.png', title:'Move closer and add light', text:'Stay about 10 to 15 cm away with even lighting. Turn on flash in a dark coop, but keep your hand out of the light.' }
    ];
    const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function renderLanding() {
      app.innerHTML = `<div class="onboarding"><div class="onboard-head"><span class="step">ChickDetect</span><button class="text-button" onclick="showScanner()">Skip</button></div><div style="margin-top:auto;margin-bottom:auto"><div class="brand-mark" style="width:76px;height:76px;border-radius:24px;font-size:34px;margin-bottom:28px">✚</div><p class="eyebrow">Photo guide</p><h1>Capture a better sample.</h1><p style="font-size:16px">Three simple checks help you capture a clearer sample and get a more useful result.</p></div><button class="primary" onclick="startGuide()">Start Photo Guide  →</button></div>`;
      nav.classList.add('hidden');
    }
    function renderOnboarding() {
      const item = onboarding[onboardingStep];
      app.innerHTML = `<div class="onboarding">
        <div class="onboard-head"><span class="step">Step ${onboardingStep + 1} of 3</span><button class="text-button" onclick="showScanner()">Skip</button></div>
        <img class="hero-image" src="${item.image}" alt="${esc(item.title)}">
        <div class="onboard-copy"><h1>${esc(item.title)}</h1><p>${esc(item.text)}</p></div>
        <div class="dots">${onboarding.map((_, i) => `<button class="dot ${i === onboardingStep ? 'active' : ''}" onclick="goStep(${i})" aria-label="Step ${i + 1}"></button>`).join('')}</div>
        <button class="primary" onclick="nextStep()">${onboardingStep === 2 ? 'Start Scanning  →' : 'Next  →'}</button>
      </div>`;
      nav.classList.add('hidden');
    }
    function goStep(step) { onboardingStep = step; renderOnboarding(); }
    function startGuide() { onboardingStep = 0; renderOnboarding(); }
    function nextStep() { onboardingStep < 2 ? (onboardingStep++, renderOnboarding()) : showScanner(); }
    function shell(content, title, subtitle='') {
      nav.classList.remove('hidden');
      app.innerHTML = `<div class="scanner"><header class="scanner-top"><div class="brand"><div class="brand-mark">✚</div><div><p class="eyebrow">ChickDetect</p><strong>${title}</strong></div></div><div><div class="status">Ready offline</div><button class="icon-button" onclick="showScreen('settings')" aria-label="Settings">⚙</button></div></header>${subtitle ? `<div class="scan-copy"><h2>${subtitle}</h2><p>Analysis stays on this phone.</p></div>` : ''}${content}</div>`;
      updateNav(title);
    }
    function showScanner() {
      shell(`<div class="camera"><div class="camera-art" role="img" aria-label="Live camera preview"></div><div class="frame"></div><div class="camera-label"><span class="pill">Aim 10–15 cm from sample</span><span>● LIVE</span></div></div><div class="control-row"><button class="control" onclick="showGallery()"><strong>▧</strong>Gallery</button><button class="control scan-button" onclick="showAnalyzing()"><strong>◉</strong>Scan</button><button class="control" onclick="showScreen('guide')"><strong>▣</strong>Guide</button></div><div class="privacy">No photo leaves your phone</div>`, '100% on device', 'Scan the dropping');
    }
    function showGallery() { showAnalyzing(); }
    function showAnalyzing() {
      shell(`<div class="camera"><div class="camera-art" role="img" aria-label="Analysis preview"></div><div class="frame"></div><div class="camera-label"><span class="pill">Processing on-device...</span><span>1.8s</span></div></div><div class="content"><div class="success">Analysis in progress</div><p>MobileNetV2 is checking the sample against the local disease model.</p></div>`, '100% on device', 'Analyzing sample');
      setTimeout(showResult, 1100);
    }
    function showResult() {
      nav.classList.add('hidden');
      app.innerHTML = `<div class="result"><div class="topbar"><button class="secondary" onclick="showScanner()">← Back</button><span class="status">Scan complete</span></div><div class="success" style="font-size:34px;text-align:center;padding:32px 14px">✓<br><small style="font-size:14px">Diagnostic triage complete</small></div><h2 style="margin-top:18px">Flock health status: Healthy</h2><div class="result-row"><span>Dropping analysis</span><strong>Clear, normal</strong></div><div class="result-row"><span>Moisture level</span><strong>Balanced</strong></div><div class="result-row"><span>AI confidence</span><strong>99.7%</strong></div><div class="result-row"><span>Flock status</span><strong>Monitored</strong></div><div class="actions"><button class="primary" onclick="showDetail()">View Full Details</button><button class="secondary" onclick="showScanner()">Scan Again</button></div></div>`;
    }
    function showDetail() {
      nav.classList.add('hidden');
      app.innerHTML = `<div class="content"><div class="topbar" style="padding:0 0 18px"><button class="secondary" onclick="showResult()">← Back</button><span class="status">Scan details</span></div><h2>Healthy sample</h2><p>This result is a strong match for a normal, balanced dropping. Continue monitoring the flock and keep fresh samples in the centre of each frame.</p><div class="card"><div class="result-row"><span>Confidence band</span><strong>Strong match</strong></div><div class="result-row"><span>Processed</span><strong>On device</strong></div><div class="result-row"><span>Recommendation</span><strong>Continue monitoring</strong></div></div><button class="primary" onclick="showScanner()">Scan Another Sample</button></div>`;
    }
    function updateNav(title) { document.querySelectorAll('.nav button').forEach(button => button.classList.toggle('active', button.dataset.screen === title)); }
    function showScreen(screen) {
      if (screen === 'scanner') return showScanner();
      if (screen === 'history') return showHistory();
      if (screen === 'guide') return showGuide();
      if (screen === 'settings') return showSettings();
    }
    function showHistory() {
      shell(`<div class="content"><div class="section-title"><div><p class="eyebrow">Your flock</p><h2>Scan history</h2></div><button class="secondary" onclick="showScanner()">+ New scan</button></div><div class="metric"><div class="card"><strong>12</strong><span>Total scans</span></div><div class="card"><strong>10</strong><span>Healthy</span></div><div class="card"><strong>2</strong><span>Review</span></div></div><div class="card history-item"><div class="history-thumb">✓</div><div><h3>Healthy sample</h3><p>Today · Pen 4A</p></div><span class="tag">Healthy</span></div><div class="card history-item"><div class="history-thumb">✓</div><div><h3>Morning check</h3><p>Yesterday · Coop A</p></div><span class="tag">Healthy</span></div><div class="card history-item"><div class="history-thumb" style="background:linear-gradient(145deg,#c99842,#8d5d20)">!</div><div><h3>Needs review</h3><p>18 Sep · Pen 2</p></div><span class="tag" style="color:#9a641c;background:#fff1d8">Review</span></div></div>`, 'history');
    }
    function showGuide() {
      shell(`<div class="content"><div class="section-title"><div><p class="eyebrow">Learn & prevent</p><h2>Photo guide</h2></div></div><div class="card guide-card"><img src="assets/onboarding/step_scan.png"><div><h3>Find fresh samples</h3><p>Scan soon after the sample appears for the clearest result.</p></div></div><div class="card guide-card"><img src="assets/onboarding/step_analyze.png"><div><h3>Keep one in frame</h3><p>Separate one dropping and keep bedding and feet out.</p></div></div><div class="card guide-card"><img src="assets/onboarding/step_result.png"><div><h3>Read your result</h3><p>Use confidence and guidance together, not as a diagnosis alone.</p></div></div><button class="primary" onclick="showDiseases()">Open Disease Guide</button></div>`, 'guide');
    }
    function showDiseases() { alert('Disease Guide: expand this route in the Flutter app for the full condition reference.'); }
    function showSettings() {
      shell(`<div class="content"><div class="section-title"><div><p class="eyebrow">App preferences</p><h2>Settings</h2></div></div><div class="card"><div class="setting"><div class="setting-icon">⌁</div><div class="setting-copy"><strong>Offline mode</strong><span>Keep analysis on this phone</span></div><button class="toggle on" onclick="this.classList.toggle('on')"></button></div><div class="setting"><div class="setting-icon">◉</div><div class="setting-copy"><strong>Scan reminders</strong><span>Get helpful flock check prompts</span></div><button class="toggle" onclick="this.classList.toggle('on')"></button></div><div class="setting"><div class="setting-icon">文</div><div class="setting-copy"><strong>Language</strong><span>English · Filipino</span></div><button class="secondary">Change</button></div></div><button class="primary" onclick="showScanner()">Back to Scanner</button></div>`, 'settings');
    }
    renderLanding();
  </script>
</body>
</html>
